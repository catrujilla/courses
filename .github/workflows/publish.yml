name: Publish Website

on:
  push:
    branches: [main]

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - run: quarto render

      - uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages